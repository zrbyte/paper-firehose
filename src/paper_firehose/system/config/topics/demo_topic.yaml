# this is an example configuration file for a topic
# see config.yaml for global configuration options
name: "Demo"
description: "Demo topic, best demo of all time"

# Which feeds to process for this topic
feeds:
  - "cond-mat"
  - "nature"
  - "science"
  - "nat-mat"
  - "nat-nanotech"
  - "nat-phys"
  - "nat-chem"
  - "nat-ener"
  - "nat-catal"
  - "nat-chem-eng"
  - "nat-rev-phys"
  - "pnas"
  - "joule"
  - "prb"
  - "prl"
  - "prx"
  - "pr_res"
  - "nano-lett"
  - "acs-nano"
  - "acs-en-lett"
  - "en-env-sci"
  - "science-adv"
  - "sci-rep"
  - "nat-comm"
  - "comm-phys"
  - "comm-mater"
  - "scipost"
  - "small"
  - "adv-mater"
  - "adv-sci"
  - "adv-func-mater"
  - "adv-phys-res"
  - "national-sci-rev"
  - "npj-2d-mater"
  - "npj-comp-mater"
  - "npj-qmat"

# Regex filter
filter:
  pattern: 'graphe[a-z]+'
  fields: ["title", "summary"]

# Ranking configuration
ranking: 
  query: >   # Natural-language ranking query used for sentence-transformers similarity
    graphene, STM, scanning tunneling microscopy

  # Optional additional negative phrases to downweight (list may be empty)
  negative_queries: [erratum, correction, reply, corrigendum]

  # Preferred authors. Names in this list get a ranking boost. Order: First name (or initial), Last name.
  preferred_authors: [Example Eric]
  priority_author_boost: 0.2

  # Sentence-Transformers model used for ranking (can be overridden per topic)
  model: "all-MiniLM-L6-v2"

# Abstract fetch configuration
abstract_fetch:
  enabled: true
  rank_threshold: 0.2 # this overrides the global rank_threshold in config.yaml. Should be smaller than score_cutoff

# PDF full-text summaries (REQUIRED for pqa_summary command)
paperqa:
  # Download arXiv PDFs for entries with rank_score >= this threshold
  download_rank_threshold: 0.35

  # arXiv API rate limiting (rps <= 0.33 recommended for politeness)
  rps: 0.3
  max_retries: 3

  # OpenAI model that reads the full text (one call per paper)
  llm: "gpt-6.2-sol"
  # Optional: reasoning effort (none, low, medium, high, xhigh, max; model-dependent)
  # reasoning_effort: "low"

  # Instructions for the summary ({ranking_query} is substituted).
  # Output is always JSON {"summary", "methods"}; no need to ask for JSON here.
  prompt: |
    Summarize for an expert reader interested in {ranking_query}.
    Keep text information-dense. Avoid superlatives.

# Cross-paper synthesis (optional; `paper-firehose synthesize`).
# One OpenAI call per topic reads the titles and abstracts of the papers this
# topic matched in the last `days` days and writes an overview plus a few
# themes. `html` and `email` show it above the topic's papers.
synthesis:
  # Without --topic, `synthesize` only processes topics that set this to true
  enabled: false
  # Papers matched in the last N days (run it daily with 1, or weekly with 7)
  days: 7
  # At most this many papers are sent, best rank score first
  max_papers: 40
  # Optional: only papers with at least this rank score
  # min_rank: 0.3
  # OpenAI model (default: the same as paperqa.llm's default)
  # model: "gpt-6.2-sol"
  # reasoning_effort: "low"
  # Extra instructions ({ranking_query} is substituted). The output is always
  # JSON {"overview", "themes"}; no need to ask for JSON here.
  # prompt: |
  #   Write for an expert reader interested in {ranking_query}.

# Output configuration
output:
  filename: "results_demo.html"
  filename_ranked: "results_demo_ranked.html"
  archive: true # archive the output file to the "matched_entries_history.db" database
